ue = text.replace(/^\"|\"$/g, ''), seconds = 0;\n  if (text.startsWith('{')) {\n    let j; try { j = JSON.parse(text); } catch { throw new Problem(502, 'garmin', 'Garmin sent an access reply that could not be read.'); }\n    value = j.access_token || j.accessToken || j.token || '';\n    seconds = Number(j.expires_in || j.expiresIn) || 0;\n  }\n  if (!/^[\\x21-\\x7e]+$/.test(value)) throw new Problem(502, 'garmin', 'Garmin sent no usable access token.');\n  token = value;\n  expires = Date.now() + (seconds > 120 ? seconds - 60 : 23 * 3600) * 1000;\n  return token;\n}\n\nasync function garminGet(path, query) {\n  const url = GARMIN + path + (Object.keys(query).length ? '?' + new URLSearchParams(query) : '');\n  const send = async (accept) => fetch(url, { headers: { Authorization: 'Bearer ' + await getToken(), Accept: accept } });\n  let accept = path.startsWith('/download-service/') ? '*/*' : 'application/json';\n  let r = await send(accept);\n  if (r.status === 401) { token = null; r = await send(accept); }\n  if (r.status === 406) r = await send('*/*');\n  return r;\n}\n\nDeno.serve(async (req) => {\n  if (req.method === 'OPTIONS') return new Response(null, { status: 204, headers: headers(req) });\n  try {\n    if (req.method !== 'POST') throw new Problem(405, 'request', 'Not allowed.');\n    await checkOwner(req);\n    let body; try { body = await req.json(); } catch { throw new Problem(400, 'request', 'Not understood.'); }\n    const path = String(body?.path || '');\n    if (path === 'ping') { await getToken(); return reply(req, 200, { ok: true }); }\n    const rule = ALLOWED.find(([re]) => re.test(path));\n    if (!rule) throw new Problem(400, 'request', 'That Garmin address is not allowed.');\n    const query = {};\n    for (const [k, v] of Object.entries(body.query || {})) {\n      if (!Object.hasOwn(rule[1], k) || !rule[1][k].test(String(v))) throw new Problem(400, 'request', 'That setting is not allowed: ' + k.slice(0, 20));\n      query[k] = String(v);\n    }\n    const r = await garminGet(path, query);\n    if (r.status === 204) return new Response(null, { status: 204, headers: headers(req) });\n    if (r.status === 429) throw new Problem(429, 'busy', 'Garmin asked for a pause. Try again later.');\n    if (!r.ok) throw new Problem(502, 'garmin', `Garmin answered HTTP ${r.status}.`);\n    return new Response(await r.arrayBuffer(), { status: 200, headers: { ...headers(req), 'Content-Type': r.headers.get('content-type') || 'application/octet-stream' } });\n  } catch (e) {\n    if (e instanceof Problem) return reply(req, e.status, { code: e.code, error: e.message });\n    console.error(e.message);\n    return reply(req, 502, { code: 'garmin', error: 'The relay could not reach Garmin. Try again later.' });\n  }\n});\n";
const GLS={synced:'exercise-garmin-synced-v1',pending:'exercise-garmin-pending-v1'};
/* key, lowest and highest value accepted */
const GFIELDS={sleepH:[0.1,24],deepH:[0,24],lightH:[0,24],remH:[0,24],awakeH:[0,24],sleepScore:[1,100],rhr:[20,200],hrv:[1,400],hrvWeek:[1,400],stress:[0,100],bbHigh:[0,100],bbLow:[0,100],steps:[1,200000],stepGoal:[1,200000],weight:[25,300],bodyFat:[2,70]};
const GCHARTS=[['Sleep','h',[['sleepH','Asleep']]],['Deep and REM sleep','h',[['deepH','Deep'],['remH','REM']]],['Sleep score','out of 100',[['sleepScore','Score']]],['Resting heart rate','bpm',[['rhr','Resting']]],['Heart rate variability (HRV)','ms',[['hrv','Last night'],['hrvWeek','7-day average']]],['Stress, daily average','',[['stress','Stress']]],['Body Battery','',[['bbHigh','Highest'],['bbLow','Lowest']]],['Steps','',[['steps','Steps']],'bar'],['Weight','kg',[['weight','Weight']]]];
const GTILES=[['sleepH','Sleep',v=>durText(v*3600)],['sleepScore','Sleep score',v=>v],['rhr','Resting HR',v=>v+' bpm'],['hrv','HRV',v=>v+' ms'],['stress','Stress',v=>v],['bbHigh','Body Battery high',v=>v],['steps','Steps',v=>v.toLocaleString('en-AU')],['weight','Weight',v=>v+' kg']];
let gDays=[], gState='loading', gError='', gBusy='', gResult=null, gRange=90;

const addDays=(s,n)=>{const d=dateOf(s);d.setDate(d.getDate()+n);return ymd(d);};
const isDay=s=>typeof s==='string'&&/^\d{4}-\d\d-\d\d$/.test(s);
/* only known figures within sensible limits are kept, whatever Garmin or a backup holds */
function cleanDay(d){
  const out={};
  for(const [k,[min,max]] of Object.entries(GFIELDS)){const v=d?.[k];if(Number.isFinite(v)&&v>=min&&v<=max) out[k]=v;}
  for(const k of ['bed','wake']) if(/^\d\d:\d\d$/.test(d?.[k]||'')) out[k]=d[k];
  const acts=(Array.isArray(d?.acts)?d.acts:[]).filter(Number.isSafeInteger); if(acts.length) out.acts=acts;
  return out;
}
const cleanDayRow=r=>({local_date:r.local_date,data:cleanDay(r.data)});
const noGarminTable=e=>e&&(e.code==='PGRST205'||e.code==='42P01'||/garmin_days.*(schema cache|does not exist)|could not find the table/i.test(e.message||''));
async function loadGarmin(){
  if(!sb||!user) return false;
  const all=[];
  for(let from=0;;from+=1000){
    const {data,error}=await sb.from('garmin_days').select('local_date,data').order('local_date',{ascending:false}).range(from,from+999);
    if(error){gState=noGarminTable(error)?'setup':'error';gError=sbFail(error);renderGarmin();return false;}
    all.push(...data); if(data.length<1000) break;
  }
  gDays=all.map(cleanDayRow).sort((a,b)=>b.local_date.localeCompare(a.local_date)); gState='ok'; gError=''; renderGarmin(); return true;
}
/* new figures are laid over what is already held: a reply with gaps never erases anything */
async function saveDays(patches){
  const list=Object.entries(patches).map(([date,p])=>{
    const old=gDays.find(r=>r.local_date===date)?.data||{}, data=cleanDay({...old,...p,acts:[...new Set([...(old.acts||[]),...(p.acts||[])])]});
    return {user_id:user.id,local_date:date,data,updated_at:new Date().toISOString()};
  }).filter(r=>Object.keys(r.data).length);
  if(!list.length) return;
  for(let i=0;i<list.length;i+=200){
    const {error}=await sb.from('garmin_days').upsert(list.slice(i,i+200),{onConflict:'user_id,local_date'});
    if(error) throw new Error(sbFail(error));
  }
  for(const r of list){const i=gDays.findIndex(x=>x.local_date===r.local_date), row={local_date:r.local_date,data:r.data}; if(i<0) gDays.push(row); else gDays[i]=row;}
  gDays.sort((a,b)=>b.local_date.localeCompare(a.local_date));
}

/* ----- talking to the relay ----- */
class RelayProblem extends Error{constructor(code,message){super(message);this.code=code;}}
const STOPS=['relay','signin','owner','setup','key','busy'];   // no point asking for anything else after one of these
async function gCall(path,query,binary){
  const {data}=await sb.auth.getSession(), token=data.session?.access_token;
  const c=sbConfig(); let r;
  try{r=await fetch(c.url+'/functions/v1/garmin',{method:'POST',headers:{apikey:c.key,Authorization:'Bearer '+(token||''),'Content-Type':'application/json'},body:JSON.stringify({path,query:query||{}})});}
  catch(e){throw new RelayProblem('relay','The Garmin relay could not be reached. Check the connection, and that the "garmin" function is set up in Supabase.');}
  if(r.status===204) return null;
  if(!r.ok){
    let j={}; try{j=await r.json();}catch(e){}
    if(j.code&&j.error) throw new RelayProblem(j.code,String(j.error).slice(0,200));
    if(r.status===404) throw new RelayProblem('relay','There is no "garmin" function in Supabase yet.');
    if(r.status===401) throw new RelayProblem('signin','Supabase refused the request. In the garmin function, turn off "Verify JWT with legacy secret".');
    throw new RelayProblem(r.status===429?'busy':'garmin',`The relay answered HTTP ${r.status}.`);
  }
  if(binary) return r.arrayBuffer();
  const text=await r.text(); if(!text.trim()) return null;
  try{return JSON.parse(text);}catch(e){throw new RelayProblem('garmin','Garmin sent something that could not be read.');}
}
/* the names and kinds of the fields in a reply, never their values: safe to share when a layout is not recognised */
function shapeOf(v,depth=0){
  if(Array.isArray(v)) return v.length&&depth<5?[shapeOf(v[0],depth+1)]:[];
  if(v&&typeof v==='object') return depth<5?Object.fromEntries(Object.entries(v).slice(0,60).map(([k,x])=>[/^[A-Za-z_]\w{0,40}$/.test(k)?k:'(key)',shapeOf(x,depth+1)])):'object';
  return v===null?'null':typeof v;
}
const asList=(v,...names)=>{if(Array.isArray(v))return v;for(const n of names)if(Array.isArray(v?.[n]))return v[n];return null;};
const pick=o=>Object.fromEntries(Object.entries(o).filter(([,v])=>v!==undefined&&v!==null));
const hours=s=>Number.isFinite(s)?Math.round(s/36)/100:undefined;
const clock=ms=>{const d=new Date(Number.isFinite(ms)?ms:NaN);return Number.isNaN(d.getTime())?undefined:d.toISOString().slice(11,16);};   // Garmin's "local" times are local time written as if UTC
const whole=v=>Number.isFinite(v)?Math.round(v):undefined;
/* each source: its request for a date range, the list inside the reply, and one day's figures from one item */
const GSOURCES=[
  {name:'Daily summary (resting heart rate, stress, Body Battery, steps)',req:(a,b)=>['/usersummary-service/v2/dailysummaries',{startDate:a,endDate:b}],list:j=>asList(j,'data'),
   day:x=>[x.calendarDate,{rhr:x.heartRate?.restingValue,stress:whole(x.stress?.avgLevel),bbHigh:x.bodyBattery?.maxValue,bbLow:x.bodyBattery?.minValue,steps:x.movement?.steps?.value,stepGoal:x.movement?.steps?.goal}]},
  {name:'Sleep',req:(a,b)=>['/sleep-service/sleep/dailySleepSummariesByDate',{startDate:a,endDate:b}],list:j=>asList(j,'data','dailySleeps','sleepSummaries'),
   day:x=>{const n=x.dailySleepDTO||x;return [n.calendarDate,{sleepH:hours(n.sleepTimeSeconds),deepH:hours(n.deepSleepSeconds),lightH:hours(n.lightSleepSeconds),remH:hours(n.remSleepSeconds),awakeH:hours(n.awakeSleepSeconds),sleepScore:n.sleepScores?.overall?.value,bed:clock(n.sleepStartTimestampLocal),wake:clock(n.sleepEndTimestampLocal)}];}},
  {name:'Heart rate variability',req:(a,b)=>[`/hrv-service/hrv/daily/${a}/${b}`,{}],list:j=>asList(j,'hrvSummaries'),
   day:x=>[x.calendarDate,{hrv:whole(x.lastNightAvg),hrvWeek:whole(x.weeklyAvg)}]},
  {name:'Weight',req:(a,b)=>[`/weight-service/weight/range/${a}/${b}`,{}],list:j=>asList(j,'dailyWeightSummaries','dateWeightList'),
   day:x=>{const w=x.latestWeight||x, g=w.weight, date=x.summaryDate||w.calendarDate;return [date,{weight:Number.isFinite(g)?Math.round(g/100)/10:undefined,bodyFat:w.bodyFat}];}},
];
const spans=(from,to,size=28)=>{const out=[];for(let a=from;a<=to;a=addDays(a,size))out.push([a,addDays(a,size-1)>to?to:addDays(a,size-1)]);return out;};
const say=t=>{gBusy=t;renderGarmin();};

async function syncHealthDays(from,to,res){
  for(const src of GSOURCES){
    let raw=0, got=0, sample=null;
    try{
      for(const [a,b] of spans(from,to)){
        say(`Reading ${src.name.split(' (')[0].toLowerCase()} from ${fmtDate(a)}…`);
        const [path,query]=src.req(a,b), j=await gCall(path,query); if(j===null) continue;
        const list=src.list(j);
        if(!list){sample=sample||j;raw++;continue;}
        const patches={};
        for(const item of list){
          if(!item||typeof item!=='object') continue; raw++; sample=sample||item;
          const [date,fields]=src.day(item); if(!isDay(date)) continue;
          const clean=cleanDay(pick(fields)); if(Object.keys(clean).length){patches[date]=clean;got++;}
        }
        await saveDays(patches);
      }
      res.counts.push([src.name,got]);
      if(raw&&!got) res.unknown.push({source:src.name,layout:shapeOf(sample)});
    }catch(e){
      if(!(e instanceof RelayProblem)||STOPS.includes(e.code)) throw e;
      res.failed.push(`${src.name}: ${e.message}`);
    }
  }
}
async function listActivities(from,to){
  const all=[];
  for(let start=0;start<1000;start+=50){
    const j=await gCall('/activitylist-service/activities/search/activities',{start:String(start),limit:'50',startDate:from,endDate:to});
    const list=j===null?[]:asList(j,'activityList','activities');
    if(!list) throw new RelayProblem('garmin','The activity list came in a layout this page does not know.');
    all.push(...list.filter(x=>x&&Number.isSafeInteger(x.activityId))); if(list.length<50) break;
  }
  return all;
}
async function importGarmin(item,res){
  const id=item.activityId, day=String(item.startTimeLocal||'').slice(0,10);
  const handled=gDays.some(r=>r.data.acts?.includes(id))||rows.some(r=>r.data.garminId===id);
  if(handled){res.have++;return;}
  const buf=await gCall(`/download-service/files/activity/${id}`,{},true);
  if(!buf) throw new Error('Garmin has no file for it.');
  const head=new Uint8Array(buf,0,Math.min(2,buf.byteLength));
  const files=head[0]===0x50&&head[1]===0x4b?await unzipFits(buf):[{name:id+'.fit',bytes:new Uint8Array(buf)}];
  const x=files[0], sessions=parseFit(x.bytes.buffer.slice(x.bytes.byteOffset,x.bytes.byteOffset+x.bytes.byteLength));
  const blob=new Blob([x.bytes],{type:'application/octet-stream'});
  let date=isDay(day)?day:null;
  for(const s of sessions){
    const p=s.activity; date=date||p.date;
    if(!p.type){res.other++;continue;}
    if(rows.some(r=>sameImport(r.data,p))){res.have++;continue;}
    const manual=rows.find(r=>r.data.date===p.date&&r.data.type===p.type&&!(r.data.files||[]).some(f=>f.kind==='fit'));
    const attach=manual&&await ask('Add to the exercise already logged?',`"${titleOf(manual.data)}" is logged on ${fmtDate(p.date)} without a FIT file.`,['Add the file to it','Create a new one'])===0;
    const found=Object.fromEntries(Object.entries(p).filter(([,v])=>v!==null&&v!==undefined));
    const a=attach?{...manual.data,...found}:{...found}; delete a.ai;
    a.garminId=id; if(!a.title&&item.activityName) a.title=String(item.activityName).slice(0,120);
    const meta={id:uid(),kind:'fit',name:x.name,size:blob.size,uploaded:false};
    meta.path=filePath(a,meta,'FIT Files'); a.files=[...(a.files||[]),meta];
    await idbPut(meta.id,{blob});
    if(attach) await updateRow(manual.id,manual.rev,a,s.detail); else await insertRow(uid(),a,s.detail);
    res.added++;
  }
  if(date) await saveDays({[date]:{acts:[id]}});
}
async function syncActivities(from,to,res){
  say('Looking for new activities…');
  const list=await listActivities(from,to);
  let n=0;
  for(const item of list.reverse()){   // oldest first, so an interrupted sync leaves no holes behind it
    say(`Checking activity ${++n} of ${list.length}…`);
    try{await importGarmin(item,res);}
    catch(e){
      if(e instanceof RelayProblem&&STOPS.includes(e.code)) throw e;
      if(e.conflict){await loadRows();}
      res.failed.push(`Activity on ${String(item.startTimeLocal||'').slice(0,10)}: ${e.message}`);
    }
  }
}
async function garminSync(days){
  if(gBusy) return;
  if(!loaded){toast('Still connecting to the database. Try again in a moment.');return;}
  if(gState!=='ok'&&!await loadGarmin()) return;
  const today=todayStr(), latest=gDays.find(r=>Object.keys(r.data).some(k=>k!=='acts'))?.local_date;
  if(!days&&!latest&&!lsGet(GLS.pending)){
    const i=await ask('How far back?','The first sync reads your Garmin activities and daily health. You can fetch more later.',['30 days','90 days','1 year','Cancel']);
    if(i<0||i>2) return; days=[30,90,365][i];
  }
  let from;
  if(days) from=addDays(today,1-days);
  else{from=latest?addDays(latest,-6):addDays(today,-29);}   // the last week is read again: Garmin fills in late figures
  const pending=lsGet(GLS.pending); if(isDay(pending)&&pending<from) from=pending;
  const res={added:0,have:0,other:0,counts:[],failed:[],unknown:[],stopped:''};
  gResult=null; say('Connecting to Garmin…');
  try{
    await gCall('ping');
    lsSet(GLS.pending,from);              // stays until the sync gets to the end, so a stopped one carries on from here
    await syncHealthDays(from,today,res);
    await syncActivities(from,today,res);
    lsSet(GLS.pending,null); lsSet(GLS.synced,Date.now());
  }catch(e){console.error(e);res.stopped=e.message;res.code=e.code;}
  gBusy=''; gResult=res; if(res.added) afterChange(); renderGarmin();
}

/* ----- targets for the latest daily figures ----- */
const getTargets=()=>(user&&user.user_metadata&&user.user_metadata.targets)||lsGet(LS.targets)||{};
/* key, accepted range for an own target, input step, unit in the targets form */
const TFIELDS={sleepH:[4,12,0.25,'hours, at least'],sleepScore:[1,100,1,'or more'],rhr:[30,120,1,'bpm or less'],hrv:[5,300,1,'ms or more'],stress:[1,100,1,'or less'],bbHigh:[1,100,1,'or more'],steps:[500,60000,100,'or more'],weight:[30,250,0.1,'kg goal']};
/* the suggested value: general guidance, except HRV, which is compared with your own recent nights */
function suggestedTarget(k,day){
  const age=ageOn(getProfile().dob,todayStr());
  switch(k){
    case 'sleepH':return {v:7,why:`7 to ${age>=65?8:9} hours for your age group`};
    case 'sleepScore':return {v:80,why:'80 or more is rated Good by Garmin'};
    case 'rhr':return {v:60,why:'adults are usually 60 to 100; fitter people are often lower'};
    case 'hrv':{const from=addDays(day,-30), prior=gDays.filter(r=>r.local_date<day&&r.local_date>=from&&r.data.hrv!=null).map(r=>r.data.hrv);
      return prior.length<7?{v:null,why:'needs 7 earlier nights in the last 30 days'}:{v:Math.round(prior.reduce((a,b)=>a+b,0)/prior.length*.9),why:'90% of your average over the 30 days before'};}
    case 'stress':return {v:25,why:'0 to 25 is Garmin\'s resting range'};
    case 'bbHigh':return {v:76,why:'76 or more is very high reserve on Garmin\'s scale'};
    case 'steps':return age>=60?{v:6000,why:'research links 6,000 to 8,000 a day with benefit at 60 and over'}:{v:8000,why:'research links 8,000 to 10,000 a day with benefit under 60'};
  }
  return {v:null,why:'set your own goal'};
}
/* status: good, close, off, sofar (steps still counting today) or none (nothing to compare with) */
function rateDaily(k,value,day){
  const s=suggestedTarget(k,day), own=getTargets()[k], t=own??s.v, fmt=GTILES.find(x=>x[0]===k)[2];
  if(t==null) return {status:'none',word:k==='hrv'?'Not enough history':'No target set',target:k==='hrv'?'Target after 7 nights':'Set a target',t,s};
  const out=(status,word,target)=>({status,word,target,t,s});
  const grade=(good,close,low,target)=>good?out('good','On target',target):close?out('close','Close',target):out('off',low,target);
  if(k==='sleepH'){
    const v=Math.round(value*60)/60, top=Math.max(ageOn(getProfile().dob,todayStr())>=65?8:9,t+1), target=`Target ${+t.toFixed(2)} to ${+top.toFixed(2)} h`;
    if(v>top) return out(v<=top+1?'close':'off','Above range',target);
    return grade(v>=t,v>=t-1,'Well under',target);
  }
  if(k==='rhr'){const target=`Target ${t} bpm or less`;
    if(value<40&&value<=t) return out('close','Very low',target);
    return grade(value<=t,value<=Math.max(100,t+15),'High',target);}
  if(k==='stress') return grade(value<=t,value<=t+25,'High',`Target ${t} or less`);
  if(k==='weight'){const d=Math.round(Math.abs(value-t)*10)/10;return grade(d<=1,d<=3,`${d} kg from goal`,`Goal ${fmt(t)}`);}
  const floor={sleepScore:t-20,bbHigh:t-25,hrv:t*.85,steps:t*.7}[k], target=`Target ${k==='steps'?t.toLocaleString('en-AU'):t}${k==='hrv'?' ms':''} or more`;
  if(k==='steps'&&day===todayStr()&&value<t) return out('sofar',`${Math.floor(value/t*100)}% so far`,target);
  return grade(value>=t,value>=floor,'Well under',target);
}
const TMARK={good:'✓',close:'!',off:'✕',sofar:'…',none:'–'};
function openTargets(){
  const d=$('#garminDlg'), own=getTargets();
  d.innerHTML=`<div class="dhead">Daily targets</div><div class="dbody"><p class="muted">Leave a box empty to use the suggested value. These are general guides, not medical advice.</p>
    ${GTILES.map(([k,label])=>{const s=suggestedTarget(k,todayStr()),[min,max,step,unit]=TFIELDS[k];
      return `<label class="f tfield"><span><b>${label}</b> (${unit})</span><input type="number" inputmode="decimal" id="t_${k}" min="${min}" max="${max}" step="${step}" value="${own[k]??''}" placeholder="${s.v==null?(k==='hrv'?'Automatic':'Not set'):'Suggested '+s.v}"><small class="muted">${s.v==null?'':'Suggested '+s.v.toLocaleString('en-AU')+': '}${s.why}</small></label>`;}).join('')}
    <p class="muted"><b class="tk-good">✓ Green</b> meets the target. <b class="tk-close">! Amber</b> is near it: sleep within 1 hour, sleep score within 20, stress and Body Battery within 25, HRV within 15%, steps at least 70%, weight within 3 kg (green within 1 kg), resting heart rate above target but not over 100. <b class="tk-off">✕ Red</b> is further away.</p></div>
    <div class="dfoot"><button type="button" class="btn" id="gResetTargets">Use suggested</button><button type="button" class="btn" data-close>Cancel</button><button type="button" class="btn primary" id="gSaveTargets">Save targets</button></div>`;
  if(!d.open){d.showModal(); d.scrollTop=0;}
}
async function saveTargets(reset){
  const targets={};
  if(!reset) for(const [k,label] of GTILES){
    const el=$('#t_'+k), v=el.value.trim(), [min,max]=TFIELDS[k];
    if(el.validity.badInput||(v&&!(+v>=min&&+v<=max))){toast(`${label} target should be between ${min} and ${max}.`);return;}
    if(v) targets[k]=+v;
  }
  lsSet(LS.targets,targets);
  user.user_metadata={...(user.user_metadata||{}),targets};
  $('#garminDlg').close(); renderGarmin();
  try{const {error}=await sb.auth.updateUser({data:{targets}});if(error)throw error;toast('Targets saved.');}
  catch(e){toast('Targets saved on this device only.');}
}

/* ----- the panel on the main page ----- */
function garminSetup(){
  return `<details class="gsetup"><summary>How to set up Garmin sync</summary><ol>
    <li>In Supabase, open <b>SQL Editor</b>, paste the setup script and run it. <button type="button" class="linkbtn" id="gCopySql">Copy setup script</button></li>
    <li>In Supabase, open <b>Edge Functions</b>, create a function with the editor, name it <b>garmin</b>, replace its code with the relay code and deploy it. <button type="button" class="linkbtn" id="gCopyRelay">Copy relay code</button></li>
    <li>In that function's settings, turn <b>off</b> "Verify JWT with legacy secret". The relay checks your sign-in itself.</li>
    <li>In Garmin Connect on the web, open <a href="https://connect.garmin.com/app/settings/personalApiToken" target="_blank" rel="noopener">Settings, Personal API Key</a> and create a key. It is shown only once.</li>
    <li>In Supabase, open <b>Edge Functions, Secrets</b> and add <b>GARMIN_API_KEY</b> (the key) and <b>GARMIN_OWNER_EMAIL</b> (the email you sign in here with). Do not put the key anywhere else.</li>
    <li>Press <b>Sync Garmin</b>.</li></ol><textarea id="gText" rows="6" readonly hidden></textarea></details>`;
}
function garminResult(r){
  let h='';
  if(r.stopped) h+=`<p class="bad" role="alert">${esc(r.stopped)}${r.code==='busy'?' What was read is saved; press Sync Garmin later to carry on.':''}</p>`;
  if(!r.stopped||r.added||r.counts.length) h+=`<p role="status">${r.added} new exercise${r.added===1?'':'s'}${r.have?`, ${r.have} already here`:''}${r.other?`, ${r.other} of other kinds left out`:''}.${r.counts.length?` Days read: ${r.counts.map(([n,c])=>`${n.split(' (')[0].toLowerCase()} ${c}`).join(', ')}.`:''}</p>`;
  if(r.failed.length) h+=`<p class="warnnote">${r.failed.slice(0,5).map(esc).join('<br>')}${r.failed.length>5?`<br>and ${r.failed.length-5} more`:''}</p>`;
  if(r.unknown.length) h+=`<p class="warnnote">Garmin sent ${r.unknown.map(u=>esc(u.source.split(' (')[0].toLowerCase())).join(', ')} in a layout this page does not know. <button type="button" class="linkbtn" id="gCopyLayout">Copy layout details</button> (field names only, no figures) and send them to Claude.</p>`;
  return h;
}
function renderGarmin(){
  const box=$('#garmin'); if(!box) return;
  const open=$('.gsetup',box)?.open, has=gDays.some(r=>Object.keys(r.data).some(k=>k!=='acts'));
  let h=`<div class="hhead"><h2>Garmin</h2><div class="btnrow">${gState==='ok'?`<button type="button" class="btn primary" id="gSync" ${gBusy?'disabled':''}>Sync Garmin</button>`:''}${has?'<button type="button" class="btn" id="gTrends">Daily trends</button><button type="button" class="btn" id="gTargets">Targets</button>':''}</div></div>`;
  if(gState==='setup') h+=`<p class="warnnote">To bring in new activities and daily health straight from Garmin, finish the setup below, then press Check again.</p>${garminSetup()}<div class="btnrow"><button type="button" class="btn" id="gRetry">Check again</button></div>`;
  else if(gState==='error') h+=`<p class="bad">${esc(gError)}</p><button type="button" class="btn" id="gRetry">Try again</button>`;
  else if(gState==='loading') h+='<p class="muted">Loading…</p>';
  else{
    if(has){
      const rated=[];
      const tiles=GTILES.map(([k,label,fmt])=>{const r=gDays.find(r=>r.data[k]!=null);if(!r||r.local_date<addDays(todayStr(),-30))return '';
        const g=rateDaily(k,r.data[k],r.local_date); rated.push(g.status);
        return `<div class="stat tgt tk-${g.status}" data-k="${k}"><span>${label}</span><b>${esc(fmt(r.data[k]))}</b><em><i aria-hidden="true">${TMARK[g.status]}</i> ${g.word}</em><small class="muted">${g.target}</small><small class="muted">${r.local_date===todayStr()?'today':dateOf(r.local_date).toLocaleDateString('en-AU',{day:'numeric',month:'short'})}</small></div>`;}).join('');
      const count=s=>rated.filter(x=>x===s).length, judged=count('good')+count('close')+count('off');
      h+=tiles?`${judged?`<p class="tscore"><b>${count('good')} of ${judged} on target</b> <span class="tk-good">✓ ${count('good')}</span> <span class="tk-close">! ${count('close')} close</span> <span class="tk-off">✕ ${count('off')} off</span></p>`:''}<div class="metrics">${tiles}</div>`:'<p class="muted">No daily figures in the last 30 days.</p>';
    }
    if(gBusy) h+=`<p class="muted" role="status">${esc(gBusy)}</p>`;
    else{
      if(gResult) h+=garminResult(gResult);
      const at=lsGet(GLS.synced);
      h+=`<p class="muted hfoot">${at?`Last synced on this device ${new Date(at).toLocaleString('en-AU',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'})}. <button type="button" class="linkbtn" id="gMore">Fetch more history</button>`:has?'<button type="button" class="linkbtn" id="gMore">Fetch more history</button>':'Press Sync Garmin to bring in activities and daily health.'}</p>`;
      if(!has||gResult?.stopped) h+=garminSetup();
    }
  }
  box.innerHTML=h; if(open&&$('.gsetup',box)) $('.gsetup',box).open=true;
}
async function gCopy(text,done){
  try{await navigator.clipboard.writeText(text);toast(done);}
  catch(e){const t=$('#gText');if(!t){toast('Copying was blocked by the browser.');return;}t.closest('details').open=true;t.hidden=false;t.value=text;t.select();toast('Select all the text in the box and copy it.');}
}

/* ----- daily trends ----- */
function dailyChart([title,unit,series,kind],days,from,to){
  const t0=dateOf(from).getTime(), t1=dateOf(to).getTime(), DAY=86400000, n=Math.round((t1-t0)/DAY)+1;
  const lines=series.map(([key,name],i)=>({key,name,i,pts:days.filter(r=>r.data[key]!=null).map(r=>({d:r.local_date,k:Math.round((dateOf(r.local_date).getTime()-t0)/DAY),v:r.data[key]}))})).filter(s=>s.pts.length);
  if(!lines.length) return '';
  const all=lines.flatMap(s=>s.pts.map(p=>p.v)), bar=kind==='bar';
  let lo=bar?0:Math.min(...all), hi=Math.max(...all); const pad=(hi-lo)*.12||Math.max(1,hi*.1); if(!bar) lo=Math.max(0,lo-pad); hi+=pad;
  const W=560,H=140,L=48,R=6, step=(W-L-R)/n, x=k=>L+(k+.5)*step, y=v=>H-6-(v-lo)/(hi-lo)*(H-14);
  const num=v=>{const k=hi-lo<5?100:hi-lo<50?10:1;return (Math.round(v*k)/k).toLocaleString('en-AU');};
  const day=d=>dateOf(d).toLocaleDateString('en-AU',{day:'numeric',month:'short',year:'2-digit'});
  const avg=s=>Math.round(s.pts.reduce((a,p)=>a+p.v,0)/s.pts.length*10)/10;
  let marks='';
  for(const s of lines){
    if(bar){const w=Math.max(1,step-Math.min(2,step*.3));marks+=s.pts.map(p=>`<rect class="s${s.i}" x="${(x(p.k)-w/2).toFixed(1)}" y="${y(p.v).toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(0,H-6-y(p.v)).toFixed(1)}"/>`).join('');continue;}
    let run=[]; const flush=()=>{if(run.length>1) marks+=`<polyline class="s${s.i}" points="${run.map(p=>`${x(p.k).toFixed(1)},${y(p.v).toFixed(1)}`).join(' ')}"/>`;else if(run.length) marks+=`<circle class="s${s.i}" cx="${x(run[0].k).toFixed(1)}" cy="${y(run[0].v).toFixed(1)}" r="4"/>`;run=[];};
    for(const p of s.pts.slice().sort((a,b)=>a.k-b.k)){if(run.length&&p.k-run[run.length-1].k>(s.key==='weight'?3650:1)) flush();run.push(p);}   // weigh-ins are occasional: joined across the gaps
    flush();
  }
  const hits=Array.from({length:n},(_,k)=>{const at=lines.map(s=>({s,p:s.pts.find(p=>p.k===k)})).filter(o=>o.p);if(!at.length)return '';
    return `<rect class="hit" x="${(L+k*step).toFixed(1)}" y="0" width="${step.toFixed(2)}" height="${H}" data-tip="${day(at[0].p.d)}: ${at.map(o=>`${lines.length>1?o.s.name+' ':''}${o.p.v.toLocaleString('en-AU')}`).join(', ')}${unit&&!/^out of/.test(unit)?' '+unit:''}"/>`;}).join('');
  return `<figure class="trend daily"><figcaption><b>${title}${unit?` (${unit})`:''}</b></figcaption>
    <div class="legend">${lines.map(s=>`<span>${lines.length>1?`<i class="s${s.i}"></i>`:''}${s.name}: average <b>${avg(s).toLocaleString('en-AU')}</b></span>`).join('')}</div>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${title}, daily">${[lo,(lo+hi)/2,hi].map(v=>`<line class="grid" x1="${L-2}" x2="${W}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-7}" y="${y(v)+4}" text-anchor="end">${num(v)}</text>`).join('')}${marks}${hits}</svg>
    <div class="axis"><span>${day(from)}</span><span>${day(to)}</span></div></figure>`;
}
function openGarminTrends(){
  const d=$('#garminDlg'), to=todayStr(), oldest=gDays.length?gDays[gDays.length-1].local_date:to;
  const from=gRange?addDays(to,1-gRange):oldest, days=gDays.filter(r=>r.local_date>=from&&r.local_date<=to);
  const keys=GTILES.filter(([k])=>days.some(r=>r.data[k]!=null));
  d.innerHTML=`<div class="dhead">Garmin daily trends</div><div class="dbody"><div class="chips">${[[30,'30 days'],[90,'90 days'],[365,'1 year'],[0,'All']].map(([v,l])=>`<button type="button" class="chip ${gRange===v?'on':''}" data-grange="${v}">${l}</button>`).join('')}</div>
    ${GCHARTS.map(c=>dailyChart(c,days,from,to)).join('')||'<p class="muted">No daily figures in this period.</p>'}
    ${keys.length?`<details><summary>Show figures</summary><div class="scrollx"><table class="compare"><tr><th>Date</th>${keys.map(k=>`<th>${k[1]}</th>`).join('')}</tr>${days.filter(r=>keys.some(([k])=>r.data[k]!=null)).map(r=>`<tr><th scope="row">${fmtDate(r.local_date)}</th>${keys.map(([k,,f])=>`<td>${r.data[k]!=null?esc(f(r.data[k])):''}</td>`).join('')}</tr>`).join('')}</table></div></details>`:''}
    </div><div class="dfoot"><button type="button" class="btn primary" data-close>Close</button></div>`;
  if(!d.open){d.showModal(); d.scrollTop=0;}
}
function garminClick(t){
  if(t.dataset.grange!==undefined){gRange=+t.dataset.grange;openGarminTrends();return true;}
  switch(t.id){
    case 'gSync':garminSync();return true;
    case 'gMore':ask('Fetch more history','Reads further back in Garmin. Exercises already here are not added twice, and ones you deleted stay deleted.',['90 days','1 year','2 years','Cancel']).then(i=>{if(i>=0&&i<3)garminSync([90,365,730][i]);});return true;
    case 'gTrends':openGarminTrends();return true;
    case 'gTargets':openTargets();return true;
    case 'gSaveTargets':saveTargets(false);return true;
    case 'gResetTargets':saveTargets(true);return true;
    case 'gRetry':gState='loading';renderGarmin();loadGarmin();return true;
    case 'gCopySql':gCopy(GARMIN_SQL,'Copied. Paste it into the Supabase SQL Editor.');return true;
    case 'gCopyRelay':gCopy(GARMIN_RELAY,'Copied. Paste it into the garmin function in Supabase.');return true;
    case 'gCopyLayout':gCopy(JSON.stringify(gResult?.unknown||[],null,1),'Copied the field names.');return true;
  }
  return false;
}

(async function init(){
  const q=new URLSearchParams(location.search), date=q.get('date');
  if(/^\d{4}-\d\d-\d\d$/.test(date||'')) wanted={date,add:q.get('new')==='1'};
  if(wanted){lsSet(LS.resume,{...wanted,at:Date.now()});history.replaceState(null,'',location.pathname+location.hash);}   // the hash may hold Microsoft's sign-in reply
  else{const r=lsGet(LS.resume);if(r&&Date.now()-r.at<2*60*1000)wanted=r;}                                              // survives a sign-in redirect
  $('#addRow').innerHTML=Object.entries(TYPES).map(([k,t])=>`<button type="button" class="addbtn t-${k}" data-add="${k}">${icon(k)}<span>${t.label}</span></button>`).join('');
  $('#calLink').href=CALENDAR_URL;
  initOneDrive();                // not awaited: a slow Microsoft sign-in must not hold up the exercise list
  await initDb();
})();

</script>
