<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Exercise</title>
<link rel="icon" type="image/png" href="exercise-icon.png">
<link rel="apple-touch-icon" href="exercise-icon.png">
<style>
:root{--bg:#edf0f3;--surface:#fff;--ink:#15212b;--muted:#5a6773;--line:#d3dae1;--hover:#e8edf1;--bad:#b3261e;--ok:#2e7d4f;--warn:#b26a00;--data:#2a78d6;
  --c-ride:#1f6fd6;--c-walk:#2c7a4b;--c-run:#c2571a;--c-row:#0b7a99;--c-weights:#7c4fbf}
@media (prefers-color-scheme:dark){:root{--bg:#11161b;--surface:#1a2129;--ink:#e7ecf0;--muted:#94a1ad;--line:#2d3740;--hover:#242e37;--bad:#ff8a80;--ok:#7ad39c;--warn:#f0b85a;--data:#3987e5;
  --c-ride:#7db4ff;--c-walk:#7fd3a0;--c-run:#f0a070;--c-row:#6cc4e0;--c-weights:#c3a6f0}}
.t-ride{--k:var(--c-ride)}.t-walk{--k:var(--c-walk)}.t-run{--k:var(--c-run)}.t-row{--k:var(--c-row)}.t-weights{--k:var(--c-weights)}
*{box-sizing:border-box}[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
svg{width:20px;height:20px;flex:none}
.wrap{max-width:980px;margin:0 auto;padding:14px 14px 60px}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
h1{font-size:22px;margin:0 auto 0 0}h2{margin:0 0 6px;font-size:19px}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 11px;font-size:12.5px}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--muted)}.pill.ok i{background:var(--ok)}.pill.warn i{background:var(--warn)}.pill.bad i{background:var(--bad)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);text-decoration:none;color:inherit}
.btn:hover{background:var(--hover)}.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--surface)}.btn.danger{color:var(--bad)}.btn:disabled{opacity:.5}
.linkbtn{background:none;border:0;text-decoration:underline;padding:8px 0}
#addRow{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:8px}
.addbtn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 4px;border-radius:12px;border:1px solid var(--line);border-bottom:3px solid var(--k);background:var(--surface);font-weight:600}
.addbtn svg{width:30px;height:30px;color:var(--k)}.addbtn:hover{background:var(--hover)}
.hintrow{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;color:var(--muted);margin-bottom:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.chips,.typerow,.btnrow{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px}
.chip svg{width:16px;height:16px;color:var(--k)}.chip.on{background:var(--ink);border-color:var(--ink);color:var(--surface)}.chip.on svg{color:inherit}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:10px 0}
.seg button{border:0;background:transparent;padding:6px 12px}.seg button.on{background:var(--ink);color:var(--surface)}
#stats,.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}.stat span{display:block;font-size:12px;color:var(--muted)}.stat b{font-size:19px}
.ctitle{font-size:12.5px;color:var(--muted);margin:14px 0 4px}
#weeks svg{width:auto;height:170px;max-width:100%;display:block}#weeks text{fill:var(--muted);font-size:11px}
#weeks .grid{stroke:var(--line);stroke-width:1}#weeks .bar{fill:var(--data)}#weeks .hit{fill:transparent}
#list h3{font-size:13px;color:var(--muted);margin:16px 0 6px;scroll-margin-top:8px}
.card{display:flex;gap:12px;width:100%;text-align:left;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--k);border-radius:10px;padding:10px 12px;margin-bottom:6px}
.card:hover{background:var(--hover)}.card .ic{color:var(--k)}.card .ic svg{width:28px;height:28px}
.cb{flex:1;min-width:0;display:flex;flex-direction:column}.c1{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.c2{display:flex;flex-wrap:wrap;column-gap:14px;font-variant-numeric:tabular-nums}.c3{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cx{display:flex;gap:6px;align-items:center;color:var(--muted)}.cx img{width:46px;height:46px;object-fit:cover;border-radius:6px}.cx i{display:flex}
.over{outline:3px dashed var(--data);outline-offset:-3px}
.muted{color:var(--muted)}.bad{color:var(--bad)}.empty{color:var(--muted);text-align:center;padding:30px 10px}
#err{border:1px solid var(--bad);color:var(--bad);border-radius:10px;padding:10px 12px;margin-bottom:10px;background:var(--surface)}
#gate{max-width:420px;margin:8vh auto;padding:0 14px}#gate form{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:10px}#gate p{margin:0}
dialog{width:min(640px,calc(100vw - 16px));max-height:calc(100dvh - 24px);padding:0;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);overscroll-behavior:contain}
dialog::backdrop{background:rgba(0,0,0,.45)}#choiceDlg{width:min(440px,calc(100vw - 24px))}
.dhead{display:flex;gap:10px;align-items:center;font-size:17px;font-weight:650;padding:14px 16px 8px}.dhead small{display:block;font-size:12.5px;font-weight:400;color:var(--muted)}.dhead .ic{color:var(--k)}.dhead .ic svg{width:32px;height:32px}
.dbody{padding:6px 16px 12px;display:flex;flex-direction:column;gap:10px;align-items:stretch}.dbody p{margin:0}.dbody>.btn{align-self:flex-start}
.dfoot{display:flex;gap:8px;justify-content:flex-end;padding:10px 16px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--surface)}.sp{flex:1}
.f{display:flex;flex-direction:column;gap:3px;min-width:0}.f>span,.lab{font-size:12px;color:var(--muted)}.lab{margin-top:4px;font-weight:600}
input,textarea{border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:var(--bg);min-width:0;width:100%;font-size:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.wide{grid-column:1/-1}
.dur{display:flex;gap:6px;align-items:center}.dur input{width:76px}
.drop{border:2px dashed var(--line);border-radius:10px;padding:12px;text-align:center;color:var(--muted)}.drop .btn{margin-top:6px;color:var(--ink)}
.setrow{display:grid;grid-template-columns:minmax(0,3fr) repeat(3,minmax(0,1fr)) 34px;gap:5px;margin-bottom:5px}
.x{border:1px solid var(--line);background:transparent;border-radius:8px;width:34px;height:34px;font-size:18px;line-height:1;flex:none}
.atts{display:flex;flex-direction:column;gap:5px}.att{display:flex;gap:10px;align-items:center}.att img{width:44px;height:44px;object-fit:cover;border-radius:6px}.att span{flex:1;min-width:0;overflow-wrap:anywhere}
.photos{display:flex;flex-wrap:wrap;gap:8px}.photos button{padding:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--bg)}.photos img{display:block;height:110px;max-width:220px;object-fit:cover}
#photoDlg{width:auto;max-width:calc(100vw - 16px)}#photoDlg>img{display:block;max-width:100%;max-height:calc(100dvh - 100px);margin:auto;min-width:240px;object-fit:contain}#photoDlg>p{padding:8px 16px;margin:0}
table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:5px 6px;border-bottom:1px solid var(--line)}th{font-size:12px;color:var(--muted)}
.notes{white-space:pre-wrap}
.route{width:100%;height:auto;border:1px solid var(--line);border-radius:10px;margin-bottom:10px}.route polyline{fill:none;stroke:var(--data);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.route circle{fill:var(--ink);stroke:var(--surface);stroke-width:2}
.line{margin:0 0 10px}.line figcaption{display:flex;justify-content:space-between;font-size:12.5px}.plot{position:relative;border-bottom:1px solid var(--line);touch-action:pan-y}.plot svg{display:block;width:100%;height:100px}
.plot path{fill:none;stroke:var(--data);stroke-width:2;vector-effect:non-scaling-stroke;stroke-linejoin:round}.cross{position:absolute;top:0;bottom:0;width:1px;background:var(--muted);pointer-events:none}
#tip{position:fixed;z-index:9;pointer-events:none;background:var(--ink);color:var(--surface);padding:5px 9px;border-radius:6px;font-size:12.5px;white-space:nowrap}
#toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:9px 14px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;z-index:10}#toast.show{opacity:1}
@media (max-width:560px){#stats,.metrics{grid-template-columns:1fr 1fr}.addbtn{font-size:12px}.cx img:nth-of-type(n+2){display:none}h1{width:100%}}
</style>
</head>
<body>
<div id="gate" hidden></div>
<div class="wrap" id="main" hidden>
  <header>
    <h1>Exercise</h1>
    <button type="button" class="pill" id="dbPill"></button>
    <button type="button" class="pill" id="odPill"></button>
    <a class="btn" id="calLink" target="_blank" rel="noopener">Calendar</a>
    <button type="button" class="btn" id="setBtn">Settings</button>
  </header>
  <div id="err" hidden></div>
  <div id="addRow"></div>
  <div class="hintrow"><span>Tap to log an exercise, or drop a .fit file anywhere (onto an exercise to add it there).</span><button type="button" class="btn" id="importBtn">Import .fit files</button></div>
  <section class="panel">
    <div class="chips" id="filters"></div>
    <div class="seg" id="period"><button type="button" data-period="week">Week</button><button type="button" data-period="month">Month</button><button type="button" data-period="year">Year</button><button type="button" data-period="all">All</button></div>
    <div id="stats"></div>
    <div class="ctitle">Minutes per week, last 12 weeks</div>
    <div id="weeks"></div>
  </section>
  <div id="list"></div>
</div>
<dialog id="editDlg"></dialog>
<dialog id="viewDlg"></dialog>
<dialog id="setDlg"></dialog>
<dialog id="photoDlg"></dialog>
<dialog id="choiceDlg"></dialog>
<input type="file" id="fileIn" multiple hidden accept=".fit,.zip,image/*,application/octet-stream">
<input type="file" id="backupIn" hidden accept=".json,application/json">
<div id="tip" hidden></div>
<div id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3/lib/msal-browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
'use strict';
/* ====== EDIT THESE LINES BEFORE PUBLISHING (or enter them in the page: they are then kept in this browser) ====== */
const SB_URL='';            // Supabase Project URL, e.g. https://abcdefgh.supabase.co
const SB_KEY='';            // Supabase publishable (anon) key - never the secret / service_role key
const GRAPH_CLIENT_ID='';   // Azure application (client) ID for OneDrive
const ONEDRIVE_FOLDER='marc.kirsten/Browser Tools/Exercise Tool';   // the calendar reads exercise-calendar.json from here
const CALENDAR_URL='https://mkirsten583.github.io/home-calendar/';
/* ================================================================================================================ */
const VERSION='2026-11-27 · exercise tool v1';
/* localStorage names are unique to this tool: every page on the same GitHub Pages site shares storage */
const LS={sb:'exercise-sb-v1',auth:'exercise-sb-auth-v1',cache:'exercise-data-v1',client:'exercise-clientid-v1',hint:'exercise-login-hint-v1',autotry:'exercise-autosignin-at-v1',resume:'exercise-resume-v1'};
const IN_FRAME=(()=>{try{return window.self!==window.top;}catch(e){return true;}})();
const lsGet=k=>{try{return JSON.parse(localStorage.getItem(k)||'null');}catch(e){return null;}};
const lsSet=(k,v)=>{try{v===null?localStorage.removeItem(k):localStorage.setItem(k,JSON.stringify(v));}catch(e){}};

const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
const dateOf=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
const todayStr=()=>ymd(new Date());
const mondayOf=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-(x.getDay()+6)%7);return x;};
const fmtDate=s=>dateOf(s).toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short',year:'numeric'});

const TYPES={ride:{label:'Ride',plural:'Rides'},walk:{label:'Walk',plural:'Walks'},run:{label:'Run',plural:'Runs'},row:{label:'Row',plural:'Rows'},weights:{label:'Weights',plural:'Weights'}};
const ICONS={
  ride:'<circle cx="5.5" cy="17" r="3.8"/><circle cx="18.5" cy="17" r="3.8"/><path d="M5.5 17 9 10h7l2.500 7M9 10l3.500 7L16 10M8 7h3M16 10l-1.200-3.500H17"/>',
  walk:'<circle cx="13" cy="4" r="1.8"/><path d="M12.500 8 11 14l3 3 1 5M11 14l-2.500 8M12.500 8 9 10.500V13M12.500 8l2.500 3.500 3 1"/>',
  run:'<circle cx="15" cy="4" r="1.8"/><path d="m13 8-3 5 4 3-1.500 6M10 13l-2 4H3.500M13 8l-4 .500L7 11.500M13 8l2.500 4H20"/>',
  row:'<circle cx="9" cy="6" r="1.8"/><path d="m9 9.500 2 5 5-1.500M7.500 16l3.500-1.500M5 10l15 9M2 20c2 1.5 3.5 1.5 5 0s3-1.5 5 0 3 1.5 5 0 3-1.500 5 0"/>',
  weights:'<path d="M6.500 6.500v11M17.500 6.500v11M3.500 9v6M20.500 9v6M6.500 12h11"/>',
  clip:'<path d="m21 11-8.500 8.500a5 5 0 0 1-7-7L14 4a3.300 3.300 0 0 1 4.700 4.700L10 17.300a1.700 1.700 0 0 1-2.400-2.400L15 7.500"/>',
  image:'<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.500" cy="8.500" r="1.500"/><path d="m21 15-5-5L5 21"/>',
};
const icon=n=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]}</svg>`;

/* ---------- formatting ---------- */
const hms=s=>{if(!s)return '';s=Math.round(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h?`${h}:${String(m).padStart(2,'0')}:${String(x).padStart(2,'0')}`:`${m}:${String(x).padStart(2,'0')}`;};
const durText=s=>{const m=Math.round((s||0)/60);return m<60?`${m} min`:`${Math.floor(m/60)} h ${String(m%60).padStart(2,'0')} min`;};
const kmText=m=>m?(m/1000).toFixed(m<100000?1:0)+' km':'';
function paceText(a){
  if(!a.duration||!a.distance) return null;
  const v=a.distance/a.duration, mm=s=>{s=Math.round(s);return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;};
  if(a.type==='ride') return ['Avg speed',(v*3.6).toFixed(1)+' km/h'];
  if(a.type==='row') return ['Avg split',mm(500/v)+' /500 m'];
  if(a.type==='weights') return null;
  return ['Avg pace',mm(1000/v)+' /km'];
}
const setsText=s=>(s||[]).map(x=>`${x.name} ${x.sets}×${x.reps}${x.weight?` @ ${x.weight} kg`:''}`).join(', ');
const titleOf=a=>a.title||((a.virtual?'Virtual ':'')+TYPES[a.type].label.toLowerCase()).replace(/^./,c=>c.toUpperCase());
/* one line per exercise: this is what appears in the calendar event */
function summaryOf(a){
  const p=paceText(a), bits=[];
  if(a.distance) bits.push(kmText(a.distance));
  if(a.duration) bits.push(durText(a.duration));
  if(p) bits.push(p[1]);
  if(a.avgPower) bits.push(a.avgPower+' W');
  if(a.avgHr) bits.push(a.avgHr+' bpm');
  if(a.ascent) bits.push(a.ascent+' m climb');
  if(a.calories) bits.push(a.calories+' cal');
  if(a.sets&&a.sets.length) bits.push(setsText(a.sets));
  return titleOf(a)+(bits.length?': '+bits.join(', '):'');
}

/* ---------- state ---------- */
let sb=null, user=null, rows=[], loaded=false, loadError='';
let filterType='', period='month', shown=60;
let msalApp=null, msalAccount=null, odState='off', odError='';
const clientId=()=>GRAPH_CLIENT_ID||lsGet(LS.client)||'';
const sbConfig=()=>{if(SB_URL&&SB_KEY)return{url:SB_URL,key:SB_KEY};return lsGet(LS.sb);};
const sortRows=()=>rows.sort((a,b)=>(b.data.date+(b.data.time||'')).localeCompare(a.data.date+(a.data.time||'')));
const rowById=id=>rows.find(r=>r.id===id);

let toastTimer;
/* the toast and tooltip live inside whichever dialog is on top; recreate them if that dialog was redrawn */
function floater(id){let e=document.getElementById(id);if(!e){e=document.createElement('div');e.id=id;document.body.appendChild(e);}return e;}
function toast(msg){const t=floater('toast');t.setAttribute('role','status');t.textContent=msg;t.classList.add('show');([...document.querySelectorAll('dialog[open]')].pop()||document.body).appendChild(t);clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),4500);}
function ask(title,msg,buttons){
  return new Promise(resolve=>{
    const d=$('#choiceDlg');
    d.innerHTML=`<div class="dhead">${esc(title)}</div><div class="dbody"><p>${esc(msg)}</p></div><div class="dfoot">${buttons.map((b,i)=>`<button type="button" class="btn ${i===0?'primary':''}" data-choice="${i}">${esc(b)}</button>`).join('')}</div>`;
    const done=v=>{d.close();d.onclick=null;d.oncancel=null;resolve(v);};
    d.onclick=e=>{const b=e.target.closest('[data-choice]');if(b)done(+b.dataset.choice);};
    d.oncancel=e=>{e.preventDefault();done(buttons.length-1);};
    d.showModal();
  });
}

/* ---------- files waiting for OneDrive are held on this device (IndexedDB) ---------- */
let idbP=null;
const idb=()=>idbP||(idbP=new Promise((res,rej)=>{const r=indexedDB.open('exercise-tool-files',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}));
async function idbDo(mode,fn){const db=await idb();return new Promise((res,rej)=>{const t=db.transaction('f',mode),q=fn(t.objectStore('f'));t.oncomplete=()=>res(q&&q.result);t.onerror=t.onabort=()=>rej(t.error);});}
const idbPut=(k,v)=>idbDo('readwrite',s=>s.put(v,k));
const idbGet=k=>idbDo('readonly',s=>s.get(k));
const idbDel=k=>idbDo('readwrite',s=>s.delete(k));

/* ---------- Supabase ---------- */
function badKey(k){
  if(/^sb_secret_/.test(k)) return true;
  try{return JSON.parse(atob(k.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))).role==='service_role';}catch(e){return false;}
}
const sbFail=e=>{
  const m=e.message||String(e);
  if(/relation .* does not exist|schema cache|Could not find the table/i.test(m)) return 'The database table is missing. Run exercise-tool-setup.sql in the Supabase SQL Editor.';
  if(/permission denied/i.test(m)) return 'The database refused access. Run exercise-tool-setup.sql again (it grants access to signed-in users).';
  if(/fetch/i.test(m)) return 'Could not reach Supabase. Check the connection. A free project pauses after about a week unused: open supabase.com and choose Restore.';
  return m;
};
async function loadRows(){
  if(!sb||!user) return false;
  try{
    const all=[];
    for(let from=0;;from+=1000){
      const {data,error}=await sb.from('activities').select('id,data,rev').order('local_date',{ascending:false}).order('id').range(from,from+999);
      if(error) throw error;
      all.push(...data); if(data.length<1000) break;
    }
    rows=all; sortRows(); loaded=true; loadError=''; lsSet(LS.cache,{user:user.id,rows}); render(); return true;
  }catch(e){console.error(e);loadError=sbFail(e);render();return false;}
}
const rowFields=a=>({local_date:a.date,type:a.type,data:a,updated_at:new Date().toISOString()});
async function insertRow(id,a,detail){
  const {data,error}=await sb.from('activities').insert({id,...rowFields(a),detail:detail||null,rev:1}).select('id,data,rev').single();
  if(error) throw new Error(sbFail(error));
  rows.push(data); sortRows();
}
/* the rev check stops one device silently overwriting another device's change */
async function updateRow(id,rev,a,detail){
  const patch={...rowFields(a),rev:rev+1}; if(detail!==undefined) patch.detail=detail;
  const {data,error}=await sb.from('activities').update(patch).eq('id',id).eq('rev',rev).select('id,data,rev');
  if(error) throw new Error(sbFail(error));

const GRAPH_SCOPES=['Files.ReadWrite','User.Read'];
const encPath=p=>p.split('/').map(encodeURIComponent).join('/');
const itemUrl=p=>'https://graph.microsoft.com/v1.0/me/drive/root:/'+encPath(p);
async function graphToken(){
  if(!msalApp||!msalAccount) return null;
  try{return (await msalApp.acquireTokenSilent({scopes:GRAPH_SCOPES,account:msalAccount})).accessToken;}catch(e){return null;}
}
async function graph(url,opts={}){
  const t=await graphToken(); if(!t){odState='signedout';renderPills();throw Object.assign(new Error('Sign in to OneDrive again'),{reauth:true});}
  return fetch(url,{...opts,headers:{...(opts.headers||{}),Authorization:'Bearer '+t}});
}
async function odUpload(path,blob){
  if(blob.size<=4*1024*1024){
    const r=await graph(itemUrl(path)+':/content',{method:'PUT',headers:{'Content-Type':blob.type||'application/octet-stream'},body:blob});
    if(!r.ok) throw new Error('OneDrive save failed (HTTP '+r.status+')'); return;
  }
  const s=await graph(itemUrl(path)+':/createUploadSession',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({item:{'@microsoft.graph.conflictBehavior':'replace'}})});
  if(!s.ok) throw new Error('Could not start the upload (HTTP '+s.status+')');
  const url=(await s.json()).uploadUrl, chunk=3276800;
  for(let a=0;a<blob.size;a+=chunk){
    const b=Math.min(a+chunk,blob.size);
    const r=await fetch(url,{method:'PUT',headers:{'Content-Range':`bytes ${a}-${b-1}/${blob.size}`},body:blob.slice(a,b)});
    if(!r.ok) throw new Error('Upload interrupted (HTTP '+r.status+')');
  }
}
async function odGetText(path){
  const r=await graph(itemUrl(path)+':/content'); if(r.status===404) return null;
  if(!r.ok) throw new Error('OneDrive read failed (HTTP '+r.status+')'); return r.text();
}
async function fileBlob(f){
  const local=await idbGet(f.id).catch(()=>null); if(local) return local.blob;
  if(!f.uploaded) throw new Error('This file is still waiting to upload from the device it was added on.');
  if(!msalAccount) throw new Error('Sign in to OneDrive to open this file.');
  const r=await graph(itemUrl(f.path)); if(!r.ok) throw new Error('The file was not found in OneDrive (HTTP '+r.status+')');
  const url=(await r.json())['@microsoft.graph.downloadUrl']; const d=await fetch(url);
  if(!d.ok) throw new Error('Download failed (HTTP '+d.status+')'); return d.blob();
}
const calendarFeed=()=>[...rows].reverse().map(r=>{const a=r.data;return{id:r.id,date:a.date,time:a.time||'',type:a.type,mins:Math.round((a.duration||0)/60),summary:summaryOf(a)};});
/* upload anything waiting, then refresh the calendar feed and the backup copy. Runs one at a time. */
let odChain=Promise.resolve();
function syncOneDrive(){odChain=odChain.then(doSync).catch(e=>{console.error(e);if(!e.reauth){odState='error';odError=e.message;}renderPills();});return odChain;}
async function doSync(){
  if(!msalAccount||!loaded||!user) return;     // never write the feed from a list that has not been read from the database
  odState='syncing';renderPills();
  let changed=false;
  for(const r of [...rows]){
    const waiting=(r.data.files||[]).filter(f=>!f.uploaded); if(!waiting.length) continue;
    const done=[];
    for(const f of waiting){const q=await idbGet(f.id).catch(()=>null); if(!q) continue; await odUpload(f.path,q.blob); done.push(f.id);}
    if(!done.length) continue;
    const cur=rowById(r.id); if(!cur) continue;
    const a={...cur.data,files:cur.data.files.map(f=>done.includes(f.id)?{...f,uploaded:true}:f)};
    try{
      await updateRow(cur.id,cur.rev,a);
      if(ed&&ed.id===cur.id&&ed.rev===cur.rev){ed.rev++;for(const f of ed.a.files||[]) if(done.includes(f.id)) f.uploaded=true;}   // an open editor stays current
      for(const id of done) await idbDel(id);changed=true;
    }
    catch(e){if(e.conflict){await loadRows();}else throw e;}   // blobs are kept, so the next sync tries again
  }
  const feed=calendarFeed(), path=ONEDRIVE_FOLDER+'/exercise-calendar.json';
  const old=await odGetText(path); let same=false;
  try{same=old!==null&&JSON.stringify(JSON.parse(old).activities)===JSON.stringify(feed);}catch(e){}
  if(!same){
    const stamp=new Date().toISOString();
    await odUpload(path,new Blob([JSON.stringify({app:'exercise-tool',version:1,updated:stamp,activities:feed},null,1)],{type:'application/json'}));
    await odUpload(ONEDRIVE_FOLDER+'/exercise-backup.json',new Blob([JSON.stringify({app:'exercise-tool',version:1,updated:stamp,rows:rows.map(r=>({id:r.id,data:r.data}))})],{type:'application/json'}));
  }
  odState='ok';odError='';
  if(changed){lsSet(LS.cache,{user:user.id,rows});render();}
  renderPills();
}
const rememberHint=a=>{if(a&&a.username)lsSet(LS.hint,{u:a.username,n:a.name||''});};
async function msSignIn(){
  if(!clientId()){openSettings();toast('Enter the Azure client ID first.');return;}
  if(!msalApp){await initOneDrive();if(!msalApp){toast('The Microsoft sign-in library did not load.');return;}}
  const h=lsGet(LS.hint), req={scopes:GRAPH_SCOPES}; if(h&&h.u) req.loginHint=h.u;
  try{
    if(IN_FRAME){const r=await msalApp.loginPopup(req);msalAccount=r.account;rememberHint(r.account);odState='ok';renderPills();await syncOneDrive();return;}
    lsSet(LS.autotry,Date.now()); await msalApp.loginRedirect(req);
  }catch(e){toast('Sign-in was not completed: '+e.message);}

async function initOneDrive(){
  if(!clientId()||!window.msal||msalApp){renderPills();return;}
  try{
    const app=new msal.PublicClientApplication({auth:{clientId:clientId(),authority:'https://login.microsoftonline.com/consumers',redirectUri:location.origin+location.pathname},cache:{cacheLocation:'localStorage'}});
    await app.initialize();
    let rr=null; try{rr=await app.handleRedirectPromise();}catch(e){console.error(e);toast('Microsoft sign-in problem: '+e.message);}
    for(const st of [localStorage,sessionStorage]) try{Object.keys(st).filter(k=>k.includes(clientId())&&/interaction\.status/i.test(k)).forEach(k=>st.removeItem(k));}catch(e){}
    msalApp=app;
    const hint=lsGet(LS.hint);
    msalAccount=(rr&&rr.account)||app.getAllAccounts().find(a=>!hint||a.username===hint.u)||null;   // other tools on this site have their own accounts cached
    if(msalAccount&&await graphToken()){rememberHint(msalAccount);odState='ok';}
    else if(hint){
      odState='signedout';
      try{const r=await app.ssoSilent({scopes:GRAPH_SCOPES,loginHint:hint.u});msalAccount=r.account;odState='ok';}
      catch(e){
        if(!IN_FRAME&&!document.querySelector('dialog[open]')&&Date.now()-(lsGet(LS.autotry)||0)>5*60*1000){lsSet(LS.autotry,Date.now());await app.loginRedirect({scopes:GRAPH_SCOPES,loginHint:hint.u});return;}
      }

}

function renderWeeks(){

  const step=[15,30,60,120,240,480,960].find(s=>peak/s<=4)||1920, top=Math.ceil(peak/step)*step;
  const W=Math.max(300,box.clientWidth||700),H=170,L=44,B=20,T=8,cw=(W-L)/12,bw=Math.min(28,cw-6),y=v=>T+(H-T-B)*(1-v/top);

    const lbl=w.d.getDate()+'/'+(w.d.getMonth()+1);

async function shrink(file,max,q){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url;});
    const k=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)), c=document.createElement('canvas');
    c.width=Math.max(1,Math.round(img.naturalWidth*k)); c.height=Math.max(1,Math.round(img.naturalHeight*k));
    const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
    return c;
  }finally{URL.revokeObjectURL(url);}
}
async function preparePhoto(file){
  const f={id:uid(),kind:'photo',name:file.name||'pasted picture.jpg',uploaded:false}; let blob=file;
  try{
    const big=await shrink(file,2200,.86);
    blob=await new Promise(r=>big.toBlob(r,'image/jpeg',.86));
    f.thumb=(await shrink(blob,240,.7)).toDataURL('image/jpeg',.7);
    f.name=f.name.replace(/\.[^.]+$/,'')+'.jpg';
  }catch(e){}                                  // a format this browser cannot draw (e.g. HEIC on a PC) is stored as it is
  f.size=blob.size; return {meta:f,blob};
}

}
const near=(a,b)=>a&&b&&Math.abs(new Date(a)-new Date(b))<2*60*1000;
const sameImport=(a,p)=>near(a.fitStart,p.fitStart)&&(!p.type||a.type===p.type);

/* files dropped / picked: targetId = drop onto an existing exercise; editor open = add to it */
async function handleFiles(files,targetId){
  files=[...files]; if(!files.length) return;
  if(!user){toast('Sign in first.');return;}
  if(!loaded){toast('Still connecting to the database. Try again in a moment.');return;}
  const photos=files.filter(isImage), fits=files.filter(f=>/\.(fit|zip)$/i.test(f.name));
  const other=files.length-photos.length-fits.length;
  if(other) toast('Only .fit, Garmin .zip and picture files can be added.');
  if(!photos.length&&!fits.length) return;
  const {out,bad}=await readFits(fits);
  if(bad.length) toast(bad.join('  '));
  if($('#viewDlg').open){targetId=targetId||$('#viewDlg').dataset.id;$('#viewDlg').close();}
  const editing=$('#editDlg').open;
  if(editing){readEditor();}
  else if(targetId){openEditor(targetId);}
  if(editing||targetId){
    if(out.length){
      if(out.length>1) toast('That file holds more than one exercise: only the first was added here.');
      const x=out[0], p=x.parsed.activity, a=ed.a;
      const clash=rows.find(r=>r.id!==ed.id&&sameImport(r.data,p));
      let go=true;
      if(clash) go=await ask('Already imported',`This file matches "${titleOf(clash.data)}" on ${fmtDate(clash.data.date)}.`,['Attach here as well','Cancel'])===0;
      if(go&&(a.files||[]).some(f=>f.kind==='fit')) go=await ask('Replace the FIT file?','This exercise already has a FIT file. Its figures will be replaced with the new file.',['Replace','Cancel'])===0;
      const blankNew=ed.isNew&&!a.duration&&!a.distance&&!a.fitStart;
      if(go&&!blankNew&&(p.date!==a.date||(p.type&&p.type!==a.type))) go=await ask('The file differs from this exercise',`The file is a ${p.type?TYPES[p.type].label.toLowerCase():'session'} on ${fmtDate(p.date)}; this exercise is a ${TYPES[a.type].label.toLowerCase()} on ${fmtDate(a.date)}. Use the file's details?`,['Use the file','Cancel'])===0;
      if(go){applyFit(x.parsed,x.file);if(!p.type)toast('The file does not say which type this is. Check the type at the top.');}
    }
    await addPhotos(photos); drawEditor(); return;
  }
  if(!out.length){ if(photos.length){openEditor(null);await addPhotos(photos);drawEditor();} return; }
  const fresh=out.filter((x,i)=>!rows.some(r=>sameImport(r.data,x.parsed.activity))&&!out.slice(0,i).some(y=>sameImport(y.parsed.activity,x.parsed.activity)));
  if(!fresh.length){toast('Already imported: nothing new to add.');return;}
  if(fresh.length===1){
    const x=fresh[0], p=x.parsed.activity;
    const manual=rows.find(r=>r.data.date===p.date&&r.data.type===p.type&&!(r.data.files||[]).some(f=>f.kind==='fit'));
    if(manual&&await ask('Add to the exercise already logged?',`"${titleOf(manual.data)}" is logged on ${fmtDate(p.date)} without a FIT file.`,['Add the file to it','Create a new one'])===0) openEditor(manual.id);
    else openEditor(null,{type:p.type||filterType||'ride'});
    applyFit(x.parsed,x.file); await addPhotos(photos); drawEditor();
    if(!p.type) toast('The file does not say which type this is. Check the type at the top.');
    return;
  }
  const typed=fresh.filter(x=>x.parsed.activity.type), skipped=fresh.length-typed.length;
  if(await ask('Import several files',`${typed.length} new exercises will be added.${out.length-fresh.length?` ${out.length-fresh.length} already imported.`:''}${skipped?` ${skipped} are not a ride, walk, run, row or weights: drop those one at a time.`:''}${photos.length?' Pictures are not added in a batch: drop them onto an exercise.':''}`,['Import','Cancel'])!==0) return;
  let n=0;
  for(const x of typed){
    try{
      const a={...x.parsed.activity}, meta={id:uid(),kind:'fit',name:x.file.name,size:x.file.blob.size,uploaded:false};
      meta.path=filePath(a,meta,'FIT Files'); a.files=[meta];
      await idbPut(meta.id,{blob:x.file.blob}); await insertRow(uid(),a,x.parsed.detail); n++;
    }catch(e){toast(e.message);break;}
  }
  toast(`Imported ${n} of ${typed.length}.`); afterChange();
}
async function saveEditor(){
  readEditor(); const a=ed.a;
  if(a.sets) a.sets=a.sets.filter(s=>s.name||s.sets||s.reps||s.weight);
  if(!a.date){toast('Choose a date.');return;}
  const btn=$('#saveEd'); btn.disabled=true;
  try{
    for(const f of a.files||[]) if(ed.pending.has(f.id)){f.path=filePath(a,f,f.kind==='fit'?'FIT Files':'Pictures');await idbPut(f.id,{blob:ed.pending.get(f.id)});}
    if(ed.isNew) await insertRow(ed.id,a,ed.detail); else await updateRow(ed.id,ed.rev,a,ed.detail);
    const removed=ed.removed; $('#editDlg').close(); ed=null; toast('Saved.'); afterChange(); deleteFiles(removed);
  }catch(e){
    if(e.conflict){$('#editDlg').close();ed=null;await loadRows();syncOneDrive();}
    else btn.disabled=false;
    toast(e.message||'Could not save.');
  }
}
async function deleteFiles(files){

    await idbDel(f.id).catch(()=>{});

}

/* ---------- detail view ---------- */
function routeSvg(route){
  const k=Math.cos(route[0][0]*Math.PI/180), xs=route.map(p=>p[1]*k), ys=route.map(p=>-p[0]);
  const x0=Math.min(...xs),y0=Math.min(...ys),w=Math.max(...xs)-x0||1e-5,h=Math.max(...ys)-y0||1e-5,s=Math.min(560/w,260/h);
  const pts=xs.map((x,i)=>`${((x-x0)*s+(580-w*s)/2).toFixed(1)},${((ys[i]-y0)*s+(280-h*s)/2).toFixed(1)}`);
  const a=pts[0].split(',');
  return `<svg class="route" viewBox="0 0 580 280" role="img" aria-label="Route shape"><polyline points="${pts.join(' ')}"/><circle cx="${a[0]}" cy="${a[1]}" r="5"/></svg>`;
}
const SERIES=[['hr','Heart rate','bpm',1],['pw','Power','W',1],['sp','Speed','km/h',3.6],['cad','Cadence','rpm',1],['al','Elevation','m',1]];
function chartsHtml(s){
  return SERIES.filter(([k])=>s[k]).map(([k,label,unit,mul])=>{
    const v=s[k].map(x=>x===null?null:x*mul), real=v.filter(x=>x!==null); if(real.length<2) return '';
    let lo=Math.min(...real),hi=Math.max(...real); if(hi-lo<10){hi+=5;lo-=5;}
    const T=s.t[s.t.length-1]||1; let d='',pen=false;
    v.forEach((y,i)=>{if(y===null){pen=false;return;}d+=(pen?'L':'M')+(s.t[i]/T*600).toFixed(1)+' '+(96-(y-lo)/(hi-lo)*90).toFixed(1);pen=true;});
    return `<figure class="line" data-k="${k}" data-mul="${mul}" data-unit="${unit}"><figcaption><b>${label}</b><span class="muted">${Math.round(lo)}–${Math.round(hi)} ${unit}</span></figcaption>
      <div class="plot"><svg viewBox="0 0 600 100" preserveAspectRatio="none" role="img" aria-label="${label} over time"><path d="${d}"/></svg><i class="cross" hidden></i></div></figure>`;
  }).join('');
}
let viewDetail=null;

  const m=[['Duration',hms(a.duration)],['Distance',kmText(a.distance)],p,['Avg heart rate',a.avgHr&&a.avgHr+' bpm'],['Max heart rate',a.maxHr&&a.maxHr+' bpm'],['Avg power',a.avgPower&&a.avgPower+' W'],['Max power',a.maxPower&&a.maxPower+' W'],['Avg cadence',a.avgCadence&&String(a.avgCadence)],['Climb',a.ascent!=null&&a.type!=='weights'?a.ascent+' m':''],['Max speed',a.maxSpeed&&(a.maxSpeed*3.6).toFixed(1)+' km/h'],['Calories',a.calories&&String(a.calories)]].filter(x=>x&&x[1]);
  d.innerHTML=`<div class="dhead t-${a.type}"><span class="ic">${icon(a.type)}</span><span>${esc(titleOf(a))}<small>${fmtDate(a.date)}${a.time?' at '+a.time:''}${a.source&&a.source!=='manual'?' · from '+({zwift:'Zwift',garmin:'Garmin'}[a.source]||'a FIT file'):''}</small></span></div>
  <div class="dbody">
    <div class="metrics">${m.map(([k,v])=>`<div class="stat"><span>${k}</span><b>${esc(v)}</b></div>`).join('')}</div>
    ${a.sets&&a.sets.length?`<table><tr><th>Exercise</th><th>Sets</th><th>Reps</th><th>kg</th></tr>${a.sets.map(s=>`<tr><td>${esc(s.name)}</td><td>${s.sets||''}</td><td>${s.reps||''}</td><td>${s.weight||''}</td></tr>`).join('')}</table>`:''}

    <div id="detail"></div>
    ${files.filter(f=>f.kind==='fit').map(f=>`<button type="button" class="btn" data-download="${f.id}">${icon('clip')} ${esc(f.name)}${f.uploaded?'':' (waiting to upload)'}</button>`).join('')}
    <p class="muted">Drop a .fit file or picture here to add it.</p>
  </div>
  <div class="dfoot"><span class="sp"></span><button type="button" class="btn" id="closeView">Close</button><button type="button" class="btn primary" id="editView">Edit / add files</button></div>`;

  viewDetail=data&&data.detail;

}

async function importBackup(file){
  try{

});

/* ---------- FIT file reader (Garmin / Zwift) ---------- */
const FIT_EPOCH=631065600;
const FIT_BASE={0:[1,'getUint8',0xFF],1:[1,'getInt8',0x7F],2:[1,'getUint8',0xFF],3:[2,'getInt16',0x7FFF],4:[2,'getUint16',0xFFFF],5:[4,'getInt32',0x7FFFFFFF],6:[4,'getUint32',0xFFFFFFFF],8:[4,'getFloat32',NaN],9:[8,'getFloat64',NaN],10:[1,'getUint8',0],11:[2,'getUint16',0],12:[4,'getUint32',0],13:[1,'getUint8',0xFF]};
function fitMessages(buf){
  const dv=new DataView(buf), u8=new Uint8Array(buf), out={0:[],18:[],20:[],225:[]};
  let pos=0, files=0;
  while(pos+12<=u8.length){
    const hs=u8[pos];
    if((hs!==12&&hs!==14)||String.fromCharCode(...u8.slice(pos+8,pos+12))!=='.FIT') break;
    const size=dv.getUint32(pos+4,true); const end=Math.min(pos+hs+size,u8.length);
    let p=pos+hs, lastTs=0; const defs={}; files++;
    try{
      while(p<end){
        const h=u8[p++]; let local, tsOffset=null;
        if(h&0x80){local=(h>>5)&3; tsOffset=h&31;}
        else if(h&0x40){
          local=h&15; p++; const le=u8[p++]===0; const global=dv.getUint16(p,le); p+=2; const n=u8[p++];
          const fields=[]; for(let i=0;i<n;i++){fields.push({num:u8[p],size:u8[p+1],base:u8[p+2]&0x1F});p+=3;}
          let dev=0; if(h&0x20){const m=u8[p++]; for(let i=0;i<m;i++){dev+=u8[p+1];p+=3;}}
          defs[local]={global,le,fields,dev}; continue;
        } else local=h&15;
        const d=defs[local]; if(!d) throw new Error('bad record');
        const keep=out[d.global], m={};
        for(const f of d.fields){
          const b=FIT_BASE[f.base];
          if(b&&p+f.size<=end&&f.size>=b[0]&&(keep||f.num===253)){
            const v=dv[b[1]](p,d.le);
            if(!(Number.isNaN(v)||v===b[2])) m[f.num]=v;
          }
          p+=f.size;
        }
        p+=d.dev;
        if(m[253]!==undefined) lastTs=m[253];
        else if(tsOffset!==null&&lastTs){lastTs+=(tsOffset-(lastTs&31)+32)%32; m[253]=lastTs;}
        if(keep&&p<=end) keep.push(m);
      }
    }catch(e){ if(!out[20].length&&!out[18].length) throw new Error('That FIT file is damaged and could not be read.'); }
    pos=pos+hs+size+2;
  }
  if(!files) throw new Error('That is not a FIT file.');
  return out;
}
function fitSportToType(sport,sub){
  if(sport===2||sport===21) return 'ride';
  if(sport===1) return 'run';
  if(sport===11||sport===17) return 'walk';
  if(sport===15) return 'row';
  if(sport===4){ if(sub===14) return 'row'; if(sub===6||sub===5) return 'ride'; if(sub===1||sub===45) return 'run'; if(sub===20) return 'weights'; }
  if(sport===10){ if(sub===14) return 'row'; return 'weights'; }
  return '';
}
const FIT_EXERCISES=['Bench press','Calf raise','Cardio','Carry','Chop','Core','Crunch','Curl','Deadlift','Flye','Hip raise','Hip stability','Hip swing','Hyperextension','Lateral raise','Leg curl','Leg raise','Lunge','Olympic lift','Plank','Plyo','Pull up','Push up','Row','Shoulder press','Shoulder stability','Shrug','Sit up','Squat','Total body','Triceps extension','Warm up','Run'];
function bucketSeries(recs,startTs,max=300){
  const n=Math.min(max,recs.length), keys={hr:3,pw:7,sp:73,al:78,cad:4};
  const s={t:[],hr:[],pw:[],sp:[],al:[],cad:[]};
  for(let i=0;i<n;i++){
    const part=recs.slice(Math.floor(i*recs.length/n),Math.floor((i+1)*recs.length/n)); if(!part.length) continue;
    s.t.push(Math.round((part[0][253]||startTs)-startTs));
    for(const [k,f] of Object.entries(keys)){
      const vals=part.map(r=>{
        if(k==='sp') return r[73]!==undefined?r[73]/1000:r[6]!==undefined?r[6]/1000:undefined;
        if(k==='al'){const a=r[78]!==undefined?r[78]:r[2];return a!==undefined?a/5-500:undefined;}
        return r[f];
      }).filter(v=>v!==undefined);
      s[k].push(vals.length?Math.round(vals.reduce((a,b)=>a+b,0)/vals.length*10)/10:null);
    }
  }
  for(const k of Object.keys(keys)) if(s[k].every(v=>v===null||v===0)&&k!=='al') delete s[k]; else if(s[k].every(v=>v===null)) delete s[k];
  return s;
}
function parseFit(buf){
  const m=fitMessages(buf);
  const records=m[20].filter(r=>r[253]!==undefined);
  const fileId=m[0][0]||{};
  const maker={1:'garmin',260:'zwift'}[fileId[1]]||'fit';
  let sessions=m[18];
  if(!sessions.length){
    if(!records.length) throw new Error('No exercise was found in that FIT file.');
    const a=records[0], b=records[records.length-1];
    sessions=[{2:a[253],253:b[253],7:(b[253]-a[253])*1000,9:b[5]}];
  }
  return sessions.map(s=>{
    const start=s[2]??(records[0]&&records[0][253])??fileId[4];
    if(start===undefined) throw new Error('The FIT file has no start time.');
    const endTs=s[7]!==undefined?start+s[7]/1000:s[253]??Infinity;
    const recs=sessions.length>1?records.filter(r=>r[253]>=start&&r[253]<=endTs+1):records;
    const d=new Date((start+FIT_EPOCH)*1000);
    const num=(v,scale=1)=>v===undefined?null:Math.round(v/scale*10)/10;
    const nz=v=>v?v:null;
    const maxSp=s[125]!==undefined?s[125]:s[15];
    const a={
      type:fitSportToType(s[5],s[6]), virtual:maker==='zwift'||s[6]===58, source:maker,
      fitStart:d.toISOString(),
      date:ymd(d), time:String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'),
      duration:Math.round((s[8]??s[7]??0)/1000)||null,
      distance:nz(num(s[9],100)), calories:nz(s[11]??null),
      avgHr:nz(s[16]??null), maxHr:nz(s[17]??null), avgPower:nz(s[20]??null), maxPower:nz(s[21]??null),
      avgCadence:nz(s[18]??null), maxCadence:nz(s[19]??null),
      ascent:s[22]??null, maxSpeed:maxSp?Math.round(maxSp)/1000:null,
    };
    const sets=[];
    for(const x of m[225]){
      if(x[5]!==1) continue;
      if(sessions.length>1&&x[253]!==undefined&&(x[253]<start||x[253]>endTs+60)) continue;
      const name=FIT_EXERCISES[x[7]]||'Exercise', reps=x[3]||0, weight=x[4]?Math.round(x[4]/16*10)/10:0;
      const last=sets[sets.length-1];
      if(last&&last.name===name&&last.reps===reps&&last.weight===weight) last.sets++;
      else sets.push({name,sets:1,reps,weight});
    }
    if(sets.length) a.sets=sets;
    const pts=recs.filter(r=>r[0]!==undefined&&r[1]!==undefined&&(r[0]||r[1]));
    const step=Math.max(1,Math.ceil(pts.length/500));
    const route=pts.filter((_,i)=>i%step===0||i===pts.length-1).map(r=>[+(r[0]*180/2147483648).toFixed(5),+(r[1]*180/2147483648).toFixed(5)]);
    const detail={series:recs.length>1?bucketSeries(recs,start):null,route:route.length>1?route:null};
    return {activity:a,detail:(detail.series||detail.route)?detail:null};
  });
}
/* Garmin Connect "Export Original" downloads a .zip containing the .fit */
async function unzipFits(buf){
  const dv=new DataView(buf), u8=new Uint8Array(buf);
  let e=-1; for(let i=u8.length-22;i>=Math.max(0,u8.length-65558);i--) if(dv.getUint32(i,true)===0x06054b50){e=i;break;}
  if(e<0) throw new Error('That zip file could not be read.');
  const count=dv.getUint16(e+10,true); let p=dv.getUint32(e+16,true); const out=[];
  for(let i=0;i<count;i++){
    const method=dv.getUint16(p+10,true), csize=dv.getUint32(p+20,true), nl=dv.getUint16(p+28,true), xl=dv.getUint16(p+30,true), cl=dv.getUint16(p+32,true), lo=dv.getUint32(p+42,true);
    const name=new TextDecoder().decode(u8.slice(p+46,p+46+nl)); p+=46+nl+xl+cl;
    if(!/\.fit$/i.test(name)) continue;
    const ds=lo+30+dv.getUint16(lo+26,true)+dv.getUint16(lo+28,true), raw=u8.slice(ds,ds+csize);
    let bytes;
    if(method===0) bytes=raw;
    else if(method===8) bytes=new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
    else throw new Error('That zip uses a compression this page cannot open. Unzip it first.');
    out.push({name:name.split('/').pop(),bytes});
  }
  if(!out.length) throw new Error('No .fit file was found inside that zip.');
  return out;
}
